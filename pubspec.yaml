name: periodic_table_app
description: A professional periodic table app
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  speech_to_text: ^7.0.0
  just_audio: ^0.9.39
  flutter_animate: ^4.5.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.0
  provider: ^6.1.1
  url_launcher: ^6.3.1
  cached_network_image: ^3.3.1
  google_generative_ai: ^0.2.0
  flutter_chat_ui: ^1.6.6
  flutter_chat_types: ^3.6.0
  flutter_launcher_icons:
  dropdown_button2: ^2.3.9
  lottie: ^3.1.2
  uuid: ^4.2.2
  http: ^1.1.0
  flutter_v2ray: ^1.0.5
  dio: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/
    - assets/data/
    - assets/data/periodic_table.json
    - assets/images/app_icon.png
    - assets/images/atom.png
    - assets/images/Logo.png

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir-Bold.ttf
          weight: 700
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true

  image_path: "assets/images/Logo.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/Logo.jpg"
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: false
