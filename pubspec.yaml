name: periodic_table_app
description: A professional periodic table app
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  url_launcher: ^6.1.0
  cached_network_image: ^3.3.1
  google_generative_ai: ^0.2.0
  flutter_chat_ui: ^1.6.6
  flutter_chat_types: ^3.6.0
  uuid: ^4.2.2
  http: ^1.1.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/data/
    - assets/data/periodic_table.json
    - assets/images/app_icon.png
    - assets/images/atom.png
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir-Bold.ttf
          weight: 700
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true

  image_path: "assets/heisenberg_logo_minimal2.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/heisenberg_logo_minimal2.png"
  web:
    generate: false
  windows:
    generate: true
  macos:
    generate: false