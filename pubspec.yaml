name: periodic_table_app
description: A professional periodic table app
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  url_launcher: ^6.1.0
  cached_network_image: ^3.3.1
  google_generative_ai: ^0.2.0
  flutter_chat_ui: ^1.6.6
  flutter_chat_types: ^3.6.0
  uuid: ^4.2.2
  http: ^1.1.0
  shared_preferences: ^2.2.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/periodic_table.json
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir-Bold.ttf
          weight: 700
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf