name: Flutter macOS CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Chemistry for macOS (Apple Silicon)
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-macos-arm64

      # The repository currently has no macOS project scaffolding.
      # Generate it in CI without changing the repository.
      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Generate macOS project scaffolding when missing
        run: |
          if [ ! -d macos ]; then
            flutter create --platforms=macos .
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
            VERSION="${VERSION%%+*}"
            VERSION="${VERSION//\"/}"
            VERSION="${VERSION//\'/}"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "Could not determine application version from pubspec.yaml"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build Flutter macOS release
        run: |
          flutter build macos --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build_number }}"

      - name: Locate and verify application bundle
        id: app
        shell: bash
        run: |
          APP_PATH="$(find build/macos/Build/Products/Release \
            -maxdepth 1 -type d -name "*.app" -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in the macOS Release directory."
            echo "Available build outputs:"
            find build/macos/Build/Products/Release -maxdepth 2 -print || true
            exit 1
          fi

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP_PATH/Contents/Info.plist")

          BINARY="$APP_PATH/Contents/MacOS/$EXECUTABLE"
          ARCHS="$(lipo -archs "$BINARY")"

          echo "Application executable: $EXECUTABLE"
          echo "Architectures: $ARCHS"

          case " $ARCHS " in
            *" arm64 "*) ;;
            *)
              echo "The application binary does not contain arm64."
              exit 1
              ;;
          esac

          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package ZIP and DMG
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.path }}"
          VERSION="${{ steps.version.outputs.version }}"
          APP_NAME="Chemistry"
          DIST_DIR="$PWD/dist"
          STAGING_DIR="$PWD/dmg-staging"

          mkdir -p "$DIST_DIR" "$STAGING_DIR"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "$DIST_DIR/${APP_NAME}-${VERSION}-macos-arm64.zip"

          ditto "$APP" "$STAGING_DIR/${APP_NAME}.app"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DIST_DIR/${APP_NAME}-${VERSION}-macos-arm64.dmg"

          echo "Created packages:"
          ls -lh "$DIST_DIR"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-macos-arm64-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: chemistry-macos-arm64-${{ needs.build.outputs.version }}-${{ github.run_number }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Chemistry ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.dmg
